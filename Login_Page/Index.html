<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Recipe Finder</h2>
        <form id="recipe-form">
            <label for="ingredients">Enter Ingredients (comma-separated):</label>
            <input type="text" id="ingredients" name="ingredients" required>
            <button type="submit">Find Recipes</button>
        </form>
        <div id="recipes"></div>
    </div>

    <script>
        document.getElementById('recipe-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ingredients = document.getElementById('ingredients').value.split(',').map(i => i.trim());
            const response = await fetch('/find-recipes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ingredients })
            });
            const recipes = await response.json();

            const recipesDiv = document.getElementById('recipes');
            recipesDiv.innerHTML = '';
            recipes.forEach(recipe => {
                const recipeHTML = `
                    <h3>${recipe.title}</h3>
                    <p><strong>Ingredients:</strong> ${recipe.ingredients}</p>
                    <p><strong>Directions:</strong> ${recipe.directions}</p>
                    <p><strong>Source:</strong> ${recipe.source}</p>
                    <a href="${recipe.link}" target="_blank" rel="noopener noreferrer">View Recipe</a>
                    <hr>
                `;
                recipesDiv.insertAdjacentHTML('beforeend', recipeHTML);
            });
        });
    </script>
</body>
</html>
