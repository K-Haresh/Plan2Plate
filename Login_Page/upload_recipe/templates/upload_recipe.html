<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Your Creation</title>
    <!-- Correctly link the CSS file using Flask's url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload_recipes.css') }}">
</head>
<body>
    <div class="container">
        <h1>Upload Your Creation</h1>
        <form method="POST">
            <div class="form-group">
                <label for="recipeName">Recipe Name:</label>
                <input type="text" id="recipeName" name="recipeName" required>
            </div>
            <div class="form-group">
                <label for="ingredients">Ingredients:</label>
                <textarea id="ingredients" name="ingredients" rows="5" placeholder="List ingredients with measurements, separated by commas" required></textarea>
            </div>
            <div class="form-group">
                <label for="directions">Directions:</label>
                <textarea id="directions" name="directions" rows="10" placeholder="Step-by-step instructions" required></textarea>
            </div>
            <div class="form-group">
                <label for="link">Recipe Link (if any):</label>
                <input type="url" id="link" name="link" placeholder="Provide the link to the recipe (optional)">
            </div>
            <div class="form-group">
                <label for="ner">NER Ingredients (without measurements):</label>
                <textarea id="ner" name="ner" rows="5" placeholder="List ingredients without measurements, separated by commas"></textarea>
            </div>
            <div class="form-group">
                <label for="site">Recipe Source Site:</label>
                <input type="text" id="site" name="site" placeholder="Name of the recipe source site (e.g., Food Network)">
            </div>
            <button type="submit" class="upload-btn">Share Your Recipe</button>
        </form>
    </div>
</body>
</html>
